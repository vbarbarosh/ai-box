name: lint

# Static checks only. The image is multi-gigabyte and the nested-Podman test
# needs a host with delegated cgroups and /dev/fuse, so neither runs here;
# `bin/build` on a real host is still the acceptance test: its last step is
# `bin/self-check --deep`.

on:
  push:
  pull_request:

# The checks read the tree and write nothing back.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The steps below find a bash script by its first line and name the node
      # and python ones: a script that starts any other way would be checked by
      # none of them, without a word.
      - name: every script starts in a way a step below reads
        run: |
          unread=$(for f in $(git ls-files bin files/bin files/bin.host files/bin.ai files/docker-entrypoint); do
            case "$(head -n 1 "$f")" in
              '#!/bin/bash'|'#!/usr/bin/env node'|'#!/usr/bin/env python3') ;;
              *) echo "$f" ;;
            esac
          done)
          test -z "$unread" || { echo "no step reads: $unread"; exit 1; }

      # bin/usage is node, not bash: it is checked with the other node script
      # below, and handed to neither bash -n nor shellcheck, which rejects an
      # unknown shebang outright.
      - name: bash -n
        run: |
          for f in $(grep -l '^#!/bin/bash' bin/* files/docker-entrypoint files/bin/* files/bin.host/* files/bin.ai/*); do
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning $(grep -l '^#!/bin/bash' bin/* files/docker-entrypoint files/bin/* files/bin.host/* files/bin.ai/*)

      # bin/run writes the relay scripts that run on the host, and
      # bin/self-check the ones it feeds to a box: text inside a heredoc,
      # which the two steps above never see. Each quoted heredoc is taken out
      # as a file and read on its own: its syntax, and shellcheck's errors.
      - name: the scripts written at run time
        run: |
          mkdir -p /tmp/written
          for f in bin/run bin/self-check; do
            awk -v out="/tmp/written/$(basename "$f")" '
              /<<.EOF.$/ { n++; file = sprintf("%s-%d.sh", out, n); printf "" > file; inside = 1; next }
              inside && /^EOF$/ { inside = 0; close(file); next }
              inside { print > file }
            ' "$f"
          done
          ls /tmp/written
          test "$(ls /tmp/written | wc -l)" -ge 10
          for f in /tmp/written/*.sh; do
            bash -n "$f"
          done
          shellcheck -s bash -S error /tmp/written/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: node --check, python compile
        run: |
          node --check bin/usage
          node --check files/bin.ai/tts
          python3 -c "import ast, sys; ast.parse(open('files/bin.ai/transcribe').read())"

      - name: executable bits
        run: |
          not_executable=$(git ls-files -s bin files/bin files/bin.host files/bin.ai files/docker-entrypoint | awk '$1 != "100755" { print $4 }')
          test -z "$not_executable" || { echo "not executable in git: $not_executable"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The linter checks a file by its extension; the node scripts have none.
      - name: rules linter
        run: |
          dir=$(mktemp -d)
          cp bin/usage "$dir/usage.cjs"
          cp files/bin.ai/tts "$dir/tts.cjs"
          npx -y vbarbarosh/rules "$dir"
