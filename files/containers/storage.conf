[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
[storage.options]
# Read-only image store shared in from the host, so inner `docker run <img>`
# needs no pull and no network.
additionalimagestores = ["/var/lib/shared"]
[storage.options.overlay]
# Native overlayfs cannot stack on the outer container's overlay upperdir.
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
