[containers]
# The sandbox's /sys/fs/cgroup is read-only, so the inner engine must not try
# to own a cgroup subtree. Cost: no per-container limits inside; limit the
# sandbox as a whole from outside instead.
cgroups = "disabled"
log_driver = "k8s-file"

# Note there is deliberately no `netns` override here. The default (a netavark
# bridge inside the sandbox's own rootless network namespace) is what lets
# compose services reach each other by service name via aardvark-dns. Forcing
# netns="pasta" gives every container its own namespace and that name
# resolution silently stops working.

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
