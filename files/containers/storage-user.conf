# Rootless podman reads THIS file, not /etc/containers/storage.conf, and it does
# not inherit additionalimagestores from the system one. Without this the shared
# store mounts at /var/lib/shared and is silently ignored: `docker run <image>`
# still works, but by pulling.
#
# graphroot and runroot are deliberately unset -- rootless podman picks its own
# under $HOME and $XDG_RUNTIME_DIR.
[storage]
driver = "overlay"

[storage.options]
additionalimagestores = ["/var/lib/shared"]

[storage.options.overlay]
# Native overlayfs cannot stack on the box's own overlay upperdir.
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
